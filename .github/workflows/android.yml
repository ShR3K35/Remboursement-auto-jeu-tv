name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la logique métier (core)
        run: SKIP_ANDROID=true ./gradlew :core:test --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du serveur de paiement / envoi
        working-directory: server
        run: npm ci && npm test

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation de l'APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: remboursement-jeux-tv-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/*.apk remboursement-jeux-tv.apk
      # Publie l'APK dans une Release : lien direct permanent
      # https://github.com/<owner>/<repo>/releases/latest/download/remboursement-jeux-tv.apk
      - name: Publier l'APK (Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remboursement Jeux TV (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: APK Android compilé automatiquement depuis ${{ github.sha }}.
          files: remboursement-jeux-tv.apk
